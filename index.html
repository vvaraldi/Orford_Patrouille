<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orford Patrouille - Portail</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏔️</text></svg>">
</head>

<body>
  <!-- Header - Minimal on portal home -->
  <header class="header">
    <nav class="nav">
      <div class="nav-logo">
        <span class="nav-logo-icon">🏔️</span>
        Orford Patrouille
      </div>
      <!-- Links shown when not authenticated -->
      <div class="nav-links" id="nav-links-guest">
        <a href="https://vvaraldi.github.io/Inspection_Rando_Orford/pages/status.html" 
           target="_blank" 
           rel="noopener noreferrer"
           title="Voir l'état des sentiers (accès public)">
          🗺️ Statut randonnée
        </a>
        <a href="pages/login.html" id="login-link">Connexion</a>
      </div>
    </nav>
  </header>

  <!-- Loading Screen -->
  <div id="loading" class="loading-screen">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p>Chargement...</p>
    </div>
  </div>

  <!-- Main Content -->
  <main id="main-content" class="main" style="display: none;">
    
    <!-- Login Prompt (shown when not authenticated) -->
    <div id="login-prompt" style="display: none;">
      <div class="content-section">
        <div class="auth-container" style="min-height: auto; padding: var(--space-xl);">
          <div class="auth-card">
            <div class="auth-header">
              <h2 class="auth-title">Bienvenue</h2>
              <p class="auth-subtitle">Connectez-vous pour accéder aux applications</p>
            </div>
            <a href="pages/login.html" class="btn btn-primary btn-full btn-lg">
              Se connecter
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Portal Section (shown when authenticated) -->
    <div id="portal-section" style="display: none;">
      <!-- User Welcome Section -->
      <div class="user-welcome">
        <div class="user-welcome-info">
          <div class="user-avatar" id="user-initials">--</div>
          <div class="user-welcome-text">
            <h3 id="welcome-name">Bonjour</h3>
            <p id="welcome-role">Chargement...</p>
          </div>
        </div>
        <div class="user-welcome-actions">
          <a href="pages/change-password.html" class="btn btn-secondary btn-sm">
            🔑 Mot de passe
          </a>
          <a href="#" class="btn btn-outline btn-sm" onclick="handleLogout(event)">
            Déconnexion
          </a>
        </div>
      </div>

      <!-- Applications Grid -->
      <h2 class="mb-lg">Applications disponibles</h2>
      
      <div class="app-grid" id="app-grid">
        <!-- App cards will be dynamically inserted based on user permissions -->
      </div>

    </div>

  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2025 Orford Patrouille - Mont Orford</p>
  </footer>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  
  <!-- Application Scripts -->
  <script src="js/auth.js"></script>
  <script src="js/mobile-menu.js"></script>
  <script src="js/portal.js"></script>
</body>
</html>
