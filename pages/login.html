<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>Orford Patrouille - Connexion</title>
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏔️</text></svg>">
  
  <!-- Load version manager first -->
  <script src="../js/version-config.js"></script>
  
  <!-- Load CSS with version -->
  <script>
    document.write(`<link rel="stylesheet" href="../css/main.css?v=${window.AppVersion.version}">`);
  </script>

</head>

<body>
  <!-- Header -->
  <header class="header">
    <nav class="nav">
      <div class="nav-logo">
        <span class="nav-logo-icon">🏔️</span>
        Orford Patrouille
      </div>
      <div class="nav-links">
        <a href="../index.html">Accueil</a>
        <a href="https://vvaraldi.github.io/Inspection_Rando_Orford/pages/status.html" 
           target="_blank" 
           rel="noopener noreferrer"
           title="Voir l'état des sentiers (accès public)">
          🗺️ Statut randonnée
        </a>
        <a href="login.html" class="active">Connexion</a>
      </div>
      <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
    </nav>
    
    <!-- Mobile Navigation -->
    <div class="mobile-nav" id="mobile-nav">
      <div class="mobile-nav-header">
        <div class="logo">🏔️ Orford Patrouille</div>
        <button class="mobile-nav-close" id="mobile-nav-close">✕</button>
      </div>
      <div class="mobile-nav-links">
        <a href="../index.html">Accueil</a>
        <a href="https://vvaraldi.github.io/Inspection_Rando_Orford/pages/status.html" 
           target="_blank" 
           rel="noopener noreferrer"
           title="Voir l'état des sentiers (accès public)">
          🗺️ Statut randonnée
        </a>
        <a href="login.html" class="active">Connexion</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">🏔️</div>
          <h1 class="auth-title">Connexion</h1>
          <p class="auth-subtitle">
            Connectez-vous à votre compte pour accéder au système Orford Patrouille.
          </p>
        </div>
        
        <form class="auth-form" id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Adresse email</label>
            <input 
              type="email" 
              class="form-control"
              id="email" 
              required 
              placeholder="votre.email@example.com"
              autocomplete="email"
            >
          </div>
          
          <div class="form-group">
            <label class="form-label" for="password">Mot de passe</label>
            <input 
              type="password" 
              class="form-control"
              id="password" 
              required 
              placeholder="Votre mot de passe"
              autocomplete="current-password"
            >
          </div>
          
          <button type="submit" class="btn btn-primary btn-full" id="login-btn">
            Se connecter
          </button>
          
          <div class="status-messages">
            <div id="error-message" class="alert alert-danger" style="display: none;"></div>
          </div>
        </form>
        
        <div class="auth-footer">
          <a href="forgot-password.html" class="auth-link">Mot de passe oublié?</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2025 Orford Patrouille - Mont Orford</p>
    <script>
      document.write(`<p style="font-size: 0.75rem; color: #999;">Version: ${window.AppVersion.version}</p>`);
    </script>
  </footer>

  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  
  <!-- Load JS with version -->
  <script>
    const v = window.AppVersion.version;
    document.write(`<script src="../js/auth.js?v=${v}"><\/script>`);
    document.write(`<script src="../js/mobile-menu.js?v=${v}"><\/script>`);
    document.write(`<script src="../js/login.js?v=${v}"><\/script>`);
  </script>

</body>
</html>
